<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bike Companion</title>
  <meta name="theme-color" content="#0e1b1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CB350RS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <script>
    // Apply the saved light/dark choice before the first paint.
    try { var t = localStorage.getItem('bc-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="top">
    <h1 id="title">My bike</h1>
    <a href="#bike" id="bikeBtn" aria-label="More: trips, parking, documents, stats, backup and settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
    </a>
  </header>

  <main id="view"></main>

  <nav id="tabs" aria-label="Main">
    <a href="#home" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>Home</span>
    </a>
    <a href="#fuel" data-tab="fuel">
      <svg viewBox="0 0 24 24"><path d="M12 3.5s6 6.2 6 10.5a6 6 0 0 1-12 0c0-4.300 6-10.500 6-10.500z"/></svg><span>Fuel</span>
    </a>
    <a href="#ride" data-tab="ride" class="ride-tab">
      <i><svg viewBox="0 0 24 24"><path d="M4.500 17a8.500 8.500 0 1 1 15 0"/><path d="m12 14 4-5"/><circle cx="12" cy="14" r="1.200"/></svg></i><span>Ride</span>
    </a>
    <a href="#service" data-tab="service">
      <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.300 5.300L3.500 17.500l3 3 5.900-5.900a4 4 0 0 0 5.300-5.300l-2.600 2.600-2.400-2.400z"/></svg><span>Garage</span>
    </a>
    <a href="#money" data-tab="money">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.500"/><path d="M3 10.500h18"/><path d="M15.500 15h2.500"/></svg><span>Money</span>
    </a>
  </nav>

  <dialog id="sheet"></dialog>
  <div id="toast" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
